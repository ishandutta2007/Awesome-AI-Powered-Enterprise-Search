<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes lineFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4; fill-opacity: 0.6; }
        50% { r: 7; fill-opacity: 1; }
      }
      .animated-bg-glow {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-card-1 {
        animation: floatCard1 7s ease-in-out infinite;
      }
      .animated-card-2 {
        animation: floatCard2 9s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: lineFlow 12s linear infinite;
      }
      .node-dot {
        animation: nodePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Rect -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- 2. Subtle Grid Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- 3. Dynamic Animated Background Light Orbs -->
  <g class="animated-bg-glow">
    <circle cx="200" cy="100" r="180" fill="#0EA5E9" opacity="0.25" filter="url(#glow)" />
    <circle cx="1000" cy="300" r="220" fill="#818CF8" opacity="0.2" filter="url(#glow)" />
    <circle cx="600" cy="380" r="150" fill="#C084FC" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- 4. Dynamic Flow Connections (Background Neural Network Graphic) -->
  <g stroke="url(#titleGrad)" stroke-width="2" opacity="0.3" class="flow-line">
    <path d="M 100 80 Q 300 200 500 120 T 900 180 T 1100 80" fill="none" />
    <path d="M 50 320 Q 250 180 550 280 T 850 220 T 1150 340" fill="none" />
  </g>

  <g fill="#38BDF8">
    <circle cx="300" cy="200" class="node-dot" style="animation-delay: 0s;" />
    <circle cx="500" cy="120" class="node-dot" style="animation-delay: 0.5s;" />
    <circle cx="900" cy="180" class="node-dot" style="animation-delay: 1s;" />
    <circle cx="250" cy="180" class="node-dot" style="animation-delay: 1.5s;" />
    <circle cx="850" cy="220" class="node-dot" style="animation-delay: 2s;" />
  </g>

  <!-- 5. Decorative Floating Tech Cards in Background sides -->
  <g class="animated-card-1" opacity="0.35">
    <rect x="60" y="240" width="180" height="90" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="80" y="275" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14">⚡ Hybrid Search</text>
    <text x="80" y="300" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12">BM25 + Vector Dense</text>
  </g>

  <g class="animated-card-2" opacity="0.35">
    <rect x="960" y="70" width="180" height="90" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="980" y="105" fill="#818CF8" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14">🧠 RAG Chat</text>
    <text x="980" y="130" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12">Citations & Governance</text>
  </g>

  <!-- 6. FOREGROUND: Main Title & Subtitle (Guaranteed Crisp & Unobstructed) -->
  <g text-anchor="middle">
    <!-- Main Header Pill -->
    <rect x="440" y="55" width="320" height="34" rx="17" fill="url(#accentGrad)" opacity="0.9" />
    <text x="600" y="77" fill="#FFFFFF" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">ENTERPRISE KNOWLEDGE DISCOVERY</text>

    <!-- Main Title -->
    <text x="600" y="155" fill="url(#titleGrad)" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome AI Enterprise Search
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="205" fill="#E2E8F0" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-weight="500" font-size="18">
      Curated Ecosystem of Commercial Platforms, RAG Engines &amp; Vector Databases
    </text>

    <!-- Key Feature Badges Row -->
    <g transform="translate(310, 240)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="170" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="85" y="24" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-weight="600" font-size="13">🔍 Hybrid Retrieval</text>
      
      <!-- Badge 2 -->
      <rect x="185" y="0" width="180" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="275" y="24" fill="#A78BFA" font-family="Segoe UI, sans-serif" font-weight="600" font-size="13">🎯 Agentic RAG Systems</text>

      <!-- Badge 3 -->
      <rect x="380" y="0" width="190" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="475" y="24" fill="#F472B6" font-family="Segoe UI, sans-serif" font-weight="600" font-size="13">🔓 Self-Hosted Open Source</text>
    </g>
    
    <!-- Bottom Footer Accent -->
    <text x="600" y="340" fill="#64748B" font-family="Segoe UI, sans-serif" font-weight="500" font-size="13">
      Open Source • SaaS Suites • Vector Search • Faceted Analytics • 100+ Enterprise Connectors
    </text>
  </g>
</svg>
