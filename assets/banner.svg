<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #FFFFFF;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #9CA3AF;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38BDF8;
      }
      .node-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #E2E8F0;
      }

      /* Subtle background dynamic animation */
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.25; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .bg-grid {
        animation: pulseGrid 6s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 8 8;
        animation: dashFlow 3s linear infinite;
      }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Base Layer: Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Layer 1: Background Grid Pattern -->
  <g class="bg-grid" stroke="#374151" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" opacity="0.5" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Layer 2: Dynamic Glowing Background Orbs & Flow Lines (Kept Behind Text) -->
  <g opacity="0.6">
    <circle cx="150" cy="100" r="120" fill="#3B82F6" opacity="0.15" filter="url(#softGlow)" />
    <circle cx="1050" cy="300" r="140" fill="#8B5CF6" opacity="0.15" filter="url(#softGlow)" />
    <circle cx="950" cy="100" r="90" fill="#06B6D4" opacity="0.1" filter="url(#softGlow)" />

    <!-- Animated Data Flow Lines (Right Side Visuals) -->
    <path d="M 750 120 C 850 120, 880 200, 980 200" fill="none" stroke="#06B6D4" stroke-width="2" class="flowing-line" opacity="0.5" />
    <path d="M 780 280 C 880 280, 900 200, 1020 200" fill="none" stroke="#8B5CF6" stroke-width="2" class="flowing-line" opacity="0.5" />
  </g>

  <!-- Layer 3: Tech Flow Nodes (Positioned safely on the right side) -->
  <g transform="translate(720, 80)">
    <!-- Node 1: Vector Search -->
    <g transform="translate(40, 30)" class="particle-1">
      <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="21" r="6" fill="#38BDF8" filter="url(#glow)" />
      <text x="36" y="25" class="node-text">Vector Retrieval</text>
    </g>

    <!-- Node 2: Hybrid RAG -->
    <g transform="translate(220, 90)" class="particle-2">
      <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="21" r="6" fill="#A855F7" filter="url(#glow)" />
      <text x="36" y="25" class="node-text">Hybrid RAG</text>
    </g>

    <!-- Node 3: AI Agents -->
    <g transform="translate(60, 170)" class="particle-3">
      <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="21" r="6" fill="#6366F1" filter="url(#glow)" />
      <text x="36" y="25" class="node-text">AI Search Agents</text>
    </g>

    <!-- Connective lines between nodes -->
    <path d="M 170 51 L 220 111 M 220 111 L 190 191" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Layer 4: FOREGROUND CONTENT (Guaranteed top readability, clear from graphics) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#38BDF8" filter="url(#glow)" />
      <text x="30" y="21" class="badge-text">ENTERPRISE KNOWLEDGE DISCOVERY</text>
    </g>

    <!-- Main Title with Gradient Stroke Accent -->
    <text x="0" y="155" class="title">
      Awesome AI-Powered
    </text>
    <text x="0" y="215" class="title" fill="url(#cyanPurple)">
      Enterprise Search
    </text>

    <!-- Subtitle / Key Features Description -->
    <text x="0" y="270" class="subtitle">
      Vector Search • Hybrid RAG • Open-Source Platforms • Knowledge Graph
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 310)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1E293B" />
      <text x="12" y="17" font-family="system-ui" font-size="11" fill="#94A3B8" font-weight="600">⚡ Sub-50ms RAG</text>

      <!-- Tag 2 -->
      <rect x="120" y="0" width="125" height="26" rx="6" fill="#1E293B" />
      <text x="132" y="17" font-family="system-ui" font-size="11" fill="#94A3B8" font-weight="600">🔒 Self-Hosted Ready</text>

      <!-- Tag 3 -->
      <rect x="255" y="0" width="110" height="26" rx="6" fill="#1E293B" />
      <text x="267" y="17" font-family="system-ui" font-size="11" fill="#94A3B8" font-weight="600">🤖 Agentic Search</text>
    </g>
  </g>

  <!-- Decorative Top & Bottom Border Highlights -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#cyanPurple)" />
</svg>
